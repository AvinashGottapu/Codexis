events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types; 
    ##Which file extension corresponds to which Content-Type.
    ## EG - .html  → text/html, .css   → text/css
    default_type  application/octet-stream;
    ## If Nginx doesn't recognize the file type,it sends it as binary data.

    # Custom log format
    ## Defines how request logs should look... Useful for debugging.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    ## Every request is stored in - /var/log/nginx/access.log  using the format named main.

    ## NGINX USES LEAKY BUCKET ALGO RATE-LIMITER... => BURST SIZED BUCKET..

    # IP-based rate limiting zone:
    # - 10MB zone tracks ~160,000 unique IP addresses.
    # - Rate: 100 requests per minute per IP address (~1.6 requests/sec).
    limit_req_zone $binary_remote_addr zone=ip_limit_zone:10m rate=100r/m;

    # 🛡️ Upstream Clusters (Gateway Circuit Breaker Configurations)
    # - max_fails=5: If Nginx encounters 5 consecutive connection failures or timeouts, it trips the circuit.
    # - fail_timeout=10s: Once tripped, Nginx blocks forwarding requests to this server for 10 seconds (open state).
    upstream problem_service_cluster {
        server host.docker.internal:3001 max_fails=5 fail_timeout=10s;
    }
    upstream submission_service_cluster {
        server host.docker.internal:3003 max_fails=5 fail_timeout=10s;
    }
    upstream user_service_cluster {
        server host.docker.internal:3005 max_fails=5 fail_timeout=10s;
    }
    upstream socket_service_cluster {
        server host.docker.internal:3004 max_fails=5 fail_timeout=10s;
    }

    server {
        listen 8000;

        # Apply IP-specific rate limiting globally to all API routes
        # - burst=30: allows occasional quick page navigation and parallel asset fetching.
        # - nodelay: keeps responses instant without throttling delay, but rejects any requests exceeding the threshold.
        # - limit_req_status 429: returns "Too Many Requests" (default is 503).
        limit_req zone=ip_limit_zone burst=30 nodelay;
        limit_req_status 429;

        # Central CORS headers configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle Preflight OPTIONS requests
        ## Browser Sends This..
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Proxy header propagation settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -------------------------------------------------------------------------
        # 🛡️ API Route Proxies with Circuit Breaker Settings
        # - proxy_connect_timeout: Fails fast if container is unresponsive (2s limit).
        # - proxy_read_timeout: Fails fast if database/API query inside service hangs (3s limit).
        # - proxy_intercept_errors: Intercepts connection/timeout errors from the backend.
        # - error_page: Redirects 502/504 errors to the JSON fallback block (tripped state).
        # -------------------------------------------------------------------------

        # 1. Problem Admin Service (Port 3001)
        location /api/problems {
            proxy_pass http://problem_service_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback_service_unavailable;
        }

        # 2. Submission Service (Port 3003)
        location /api/submissions {
            proxy_pass http://submission_service_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback_service_unavailable;
        }

        # Leaderboard Route mapped to Submission Service (Port 3003)
        location /api/leaderboard {
            proxy_pass http://submission_service_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback_service_unavailable;
        }

        # 3. User Service (Port 3005)
        location /api/users {
            proxy_pass http://user_service_cluster;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback_service_unavailable;
        }



        # 5. Socket Service (Port 3004) - WebSockets and polling
        location /socket.io/ {
            proxy_pass http://socket_service_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;
            error_page 502 504 = @fallback_service_unavailable;
        }

        # Service Health Checks mapped cleanly under Gateway
        location /health/problems {
            proxy_pass http://problem_service_cluster/health;
        }

        location /health/submissions {
            proxy_pass http://submission_service_cluster/health;
        }

        location /health/socket {
            proxy_pass http://socket_service_cluster/health;
        }

        location /health/users {
            proxy_pass http://user_service_cluster/health;
        }

        # General Health check for the Gateway itself
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"codexis-api-gateway"}';
        }

        # 🛡️ Global Fallback JSON Response when a backend service has tripped Nginx
        location @fallback_service_unavailable {
            default_type application/json;
            return 503 '{"error":"Service Temporarily Offline","message":"The requested service is busy or undergoing maintenance. Please try again in 10 seconds."}';
        }
    }
}
