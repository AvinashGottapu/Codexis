events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types; 
    ##Which file extension corresponds to which Content-Type.
    ## EG - .html  → text/html, .css   → text/css
    default_type  application/octet-stream;
    ## If Nginx doesn't recognize the file type,it sends it as binary data.

    # Custom log format
    ## Defines how request logs should look... Useful for debugging.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    ## Every request is stored in - /var/log/nginx/access.log  using the format named main.

    server {
        listen 8000;

        # Central CORS headers configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Handle Preflight OPTIONS requests
        ## Browser Sends This..
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Proxy header propagation settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Problem Admin Service (Port 3001)
        location /api/problems {
            proxy_pass http://host.docker.internal:3001;
        }
        ##  why Docker provides host.docker.internal => 
        ## host.docker.internal is a special hostname that means:  => "Connect from this container to the host machine."

        ## If Nginx is installed directly on your host (not Docker)   Then you would simply write:  proxy_pass http://localhost:3001;

        # 2. Submission Service (Port 3003)
        location /api/submissions {
            proxy_pass http://host.docker.internal:3003;
        }

        # Leaderboard Route mapped to Submission Service (Port 3003)
        location /api/leaderboard {
            proxy_pass http://host.docker.internal:3003;
        }

        # 3. User Service (Port 3005)
        location /api/users {
            proxy_pass http://host.docker.internal:3005;
        }

        # 4. Evaluator Queue Board (Port 3002)
        location /bull {
            proxy_pass http://host.docker.internal:3002;
        }

        # 5. Socket Service (Port 3004) - WebSockets and polling
        location /socket.io/ {
            proxy_pass http://host.docker.internal:3004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # Service Health Checks mapped cleanly under Gateway
        location /health/problems {
            proxy_pass http://host.docker.internal:3001/health;
        }

        location /health/submissions {
            proxy_pass http://host.docker.internal:3003/health;
        }

        location /health/socket {
            proxy_pass http://host.docker.internal:3004/health;
        }

        location /health/users {
            proxy_pass http://host.docker.internal:3005/health;
        }

        # General Health check for the Gateway itself
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"codexis-api-gateway"}';
        }
    }
}
